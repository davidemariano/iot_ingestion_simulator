# Mosquitto per lo sviluppo locale della modalità "traffico".
# NON usare così in pre-produzione: servono listener 8883 con TLS, allow_anonymous false
# e il plugin dynamic security per credenziali e ACL per stazione (§5.3, §12).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# il default è troppo basso per sopravvivere a un'indisponibilità del database (§5.3)
max_queued_messages 100000
message_size_limit 4096
