# Mosquitto per lo sviluppo locale della modalità "traffico" (profilo mqtt di docker compose).
# NON usare così in pre-produzione: servono listener 8883 con TLS, allow_anonymous false
# e il plugin dynamic security per credenziali e ACL per stazione (§5.3, §12).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
# il default è troppo basso per sopravvivere a un'indisponibilità del database (§5.3)
max_queued_messages 100000
# limite sulla dimensione dei messaggi (§12): un payload del §8.5 è di circa 250 byte
max_packet_size 8192
# niente riga di log per ogni connessione/disconnessione
connection_messages false
