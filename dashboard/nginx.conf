# Dashboard + reverse proxy verso il simulatore (servizio "simulator" di docker compose).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Stream SSE della console: niente buffering e connessione lunga, altrimenti
    # gli aggiornamenti arrivano a blocchi o la connessione cade dopo 60 s.
    location = /api/sim/stream {
        proxy_pass http://simulator:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://simulator:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # file con hash nel nome (main-XXXXXXXX.js, chunk-…, styles-…, font): immutabili
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # rotte della SPA (/stazioni, /simulatore): sempre index.html, mai in cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
