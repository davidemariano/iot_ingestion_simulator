# Dashboard + reverse proxy verso il simulatore (servizio "simulator" di docker compose).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # redirect relativi: valgono qualunque sia la porta pubblicata sull'host
    absolute_redirect off;

    # DNS interno di Docker, riletto ogni 10 s: se il simulatore viene ricreato con un
    # altro IP, nginx lo ritrova senza riavvio (con un nome statico lo risolverebbe una volta sola)
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Stream SSE della console: niente buffering e connessione lunga, altrimenti
    # gli aggiornamenti arrivano a blocchi o la connessione cade dopo 60 s.
    location = /api/sim/stream {
        set $simulator http://simulator:8000;
        proxy_pass $simulator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # con una variabile e senza URI, proxy_pass inoltra il percorso originale (/api/...)
    location /api/ {
        set $simulator http://simulator:8000;
        proxy_pass $simulator;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # file con hash nel nome (main-XXXXXXXX.js, chunk-…, styles-…, font): immutabili
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # rotte della SPA (/stazioni, /simulatore): sempre index.html, mai in cache
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
