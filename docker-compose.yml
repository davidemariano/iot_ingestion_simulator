# Richiede Docker Compose v2: Docker Desktop (macOS, Windows) oppure, su Linux, Docker Engine
# con il pacchetto docker-compose-plugin. Il vecchio docker-compose 1.x di apt non è supportato.
#
#   docker compose up --build     (o docker-compose up --build con Compose v2)
#   → dashboard e API su http://localhost:8080 · Swagger su http://localhost:8080/api/docs
#
# Mosquitto e il simulatore "traffico" (§13.3) sono nel profilo mqtt:
#   docker compose --profile mqtt up --build
# oppure COMPOSE_PROFILES=mqtt nel file .env, per avviarli con il solo up --build.
# Le variabili si cambiano in un file .env accanto a questo (vedi .env.example).

services:
  # Simulatore integrato: broker emulato, ingestion, registro, modelli NRT, API /iot
  simulator:
    build: ./simulator
    image: agrivalor-iot/simulator:local
    environment:
      IOTSIM_FATTORE: ${IOTSIM_FATTORE:-20}
      IOTSIM_SEME: ${IOTSIM_SEME:-42}
      IOTSIM_STORICO_H: ${IOTSIM_STORICO_H:-24}
      IOTSIM_CREA_STAZIONI: ${IOTSIM_CREA_STAZIONI:-0}
      IOTSIM_VUOTO: ${IOTSIM_VUOTO:-0}
    restart: unless-stopped

  # Dashboard Angular servita da nginx, che inoltra /api al simulatore
  dashboard:
    build: ./dashboard
    image: agrivalor-iot/dashboard:local
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      simulator:
        condition: service_healthy
        restart: true
    # arresto immediato: con SIGQUIT nginx aspetterebbe la chiusura dello stream SSE
    stop_signal: SIGTERM
    restart: unless-stopped

  # --- profilo "mqtt" ---------------------------------------------------------------
  # Mosquitto da sviluppo (anonimo, 1883). In pre-produzione: TLS su 8883 e plugin
  # dynamic security con credenziali per stazione (§12).
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    profiles: ["mqtt"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Simulatore del PoC: rileva le stazioni via API e pubblica i 16 canali su Mosquitto
  traffico:
    build: ./simulator
    image: agrivalor-iot/traffico:local  # stessi layer del simulatore, tag distinto: un tag
                                         # condiviso fra due build ricreerebbe il simulatore
    profiles: ["mqtt"]
    command: ["iotsim", "traffico"]
    environment:
      IOTSIM_API: http://simulator:8000/api
      IOTSIM_MQTT_HOST: mosquitto
      IOTSIM_MQTT_PORT: "1883"
      IOTSIM_FATTORE: ${IOTSIM_FATTORE:-20}
      IOTSIM_SEME: ${IOTSIM_SEME:-42}
    depends_on:
      simulator:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  mosquitto-data:
