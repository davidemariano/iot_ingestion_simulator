[project]
name = "iotsim"
version = "0.1.0"
description = "Simulatore del layer di ingestion IoT di Agrivalor (PoC): stazioni a 16 canali, broker MQTT emulato, ingestion, completezza, modelli near-real-time"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Modalità "traffico": pubblica su un broker MQTT reale e rileva le stazioni via API
mqtt = ["paho-mqtt>=2.1", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "paho-mqtt>=2.1"]

[project.scripts]
iotsim = "iotsim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iotsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
